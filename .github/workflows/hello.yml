name: Hello Robot
on: push
permissions:
  id-token: write
  contents: read
jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Get my files
        uses: actions/checkout@v4
      - name: Say hello
        run: echo "Hello from the robot, Ash!"
      - name: Show my sub
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | jq -R 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | {sub, aud}'
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::658367926950:role/github-actions-ecr-role
          aws-region: ap-south-1
      - name: Who am I in AWS
        run: aws sts get-caller-identity
      - name: List files
        run: ls
